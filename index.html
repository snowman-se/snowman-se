<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>糸引き飴 🍭</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrapper">
    <h1 class="title">🍭 糸引き飴 🍭</h1>
    <p class="subtitle">糸を引いて飴の色を当てよう！</p>

    <!-- Fruit/drink decorations -->
    <div class="decorations">
      <div class="deco banana" title="バナナ">
        <div class="banana-body"></div>
        <div class="banana-tip top"></div>
        <div class="banana-tip bottom"></div>
      </div>
      <div class="deco strawberry" title="イチゴ">
        <div class="strawberry-body"></div>
        <div class="strawberry-leaf"></div>
        <div class="strawberry-seeds">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
      </div>
      <div class="deco pineapple" title="パイナップル">
        <div class="pineapple-crown">
          <div class="leaf"></div><div class="leaf"></div><div class="leaf"></div>
        </div>
        <div class="pineapple-body">
          <div class="pineapple-pattern"></div>
        </div>
      </div>
      <div class="deco cider" title="サイダー">
        <div class="cider-bottle">
          <div class="bottle-cap"></div>
          <div class="bottle-neck"></div>
          <div class="bottle-body">
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
          </div>
          <div class="bottle-label">サイダー</div>
        </div>
      </div>
    </div>

    <!-- Stock counter -->
    <div class="stock-panel">
      <span class="stock-label">在庫数：</span>
      <span class="stock-count" id="stockCount">40</span>
      <span class="stock-label"> 個</span>
    </div>

    <!-- Candy box -->
    <div class="box-container">
      <div class="box-label">
        <span>糸引き飴</span>
        <span class="box-sub">バナナ・イチゴ・パイナップル・サイダー</span>
      </div>
      <div class="candy-box" id="candyBox">
        <div class="threads-area" id="threadsArea">
          <!-- Threads generated by JS -->
        </div>
      </div>
    </div>

    <!-- Result display -->
    <div class="result-panel" id="resultPanel" aria-live="polite">
      <div class="result-inner" id="resultInner">
        <div class="result-candy" id="resultCandy"></div>
        <div class="result-text" id="resultText"></div>
      </div>
    </div>

    <!-- History log -->
    <div class="history-panel">
      <h2>引いた履歴</h2>
      <ul class="history-list" id="historyList"></ul>
    </div>

    <!-- Reset button -->
    <button class="reset-btn" id="resetBtn">🔄 リセット（入荷）</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
