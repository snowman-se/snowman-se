{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-4">パスワードのリセット</h2>
    <p class="text-muted">登録済みのメールアドレスを入力してください。パスワードリセット用のリンクをお送りします。</p>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="{{ form.email.id_for_label }}" class="form-label">メールアドレス</label>
        <input type="email" name="email" id="{{ form.email.id_for_label }}"
               class="form-control {% if form.email.errors %}is-invalid{% endif %}"
               autofocus required>
        {% for error in form.email.errors %}
          <div class="invalid-feedback">{{ error }}</div>
        {% endfor %}
      </div>
      <button type="submit" class="btn btn-primary w-100">リセットメールを送信</button>
    </form>
    <div class="mt-3 text-center">
      <a href="{% url 'login' %}">ログインに戻る</a>
    </div>
  </div>
</div>
{% endblock %}
