{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-4">二段階認証</h2>
    <p class="text-muted">認証アプリに表示されている6桁のコードを入力してください。</p>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_code" class="form-label">認証コード</label>
        <input type="text" name="code" id="id_code"
               class="form-control"
               inputmode="numeric" pattern="[0-9]{6}"
               maxlength="6" autocomplete="one-time-code"
               autofocus required>
      </div>
      <button type="submit" class="btn btn-primary w-100">確認</button>
    </form>
  </div>
</div>
{% endblock %}
