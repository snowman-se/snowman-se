{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-4">二段階認証の設定</h2>

    <div class="card mb-4">
      <div class="card-body text-center">
        <p class="mb-2">認証アプリ（Google Authenticator、Authy など）でこのQRコードをスキャンしてください。</p>
        <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code" class="img-fluid my-3" style="max-width:220px;">
        <hr>
        <p class="text-muted small mb-1">QRコードが読み取れない場合は、以下のキーを手動で入力してください。</p>
        <code class="fs-5">{{ secret }}</code>
      </div>
    </div>

    <p>設定が完了したら、アプリに表示されている<strong>6桁のコード</strong>を入力して確認してください。</p>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_code" class="form-label">認証コード</label>
        <input type="text" name="code" id="id_code"
               class="form-control"
               inputmode="numeric" pattern="[0-9]{6}"
               maxlength="6" autocomplete="off"
               autofocus required>
      </div>
      <button type="submit" class="btn btn-success w-100">有効にする</button>
    </form>
    <div class="mt-3 text-center">
      <a href="{% url 'my_page' %}">キャンセル</a>
    </div>
  </div>
</div>
{% endblock %}
